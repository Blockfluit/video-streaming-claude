# Deploy a branch of your choosing to the dev environment.
#
# Manual only — there is no push trigger. GitHub's own "Use workflow from"
# dropdown is the branch picker: the run checks out whatever ref you select,
# which is why there is no input for it here.
#
# Builds two images, pushes them to GHCR, and asks Portainer to redeploy. See
# deploy/README.md for the one-time server setup this depends on.

name: Deploy to dev

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run the test suite first'
        type: boolean
        default: true
      image_tag:
        description: 'Moving tag the stack follows (leave as dev to deploy)'
        type: string
        default: dev

concurrency:
  # Two deploys racing would push the same moving tag and fire two webhooks, and
  # which one the server ends up running would be down to timing. Queue instead
  # of cancelling: a half-finished push is worse than a slow one.
  group: deploy-dev
  cancel-in-progress: false

jobs:
  test:
    if: ${{ inputs.run_tests }}
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: test
    # `always()` so an intentionally skipped test job does not block the deploy,
    # while a failing or cancelled one still does. Without it, skipping the tests
    # would skip this job too.
    if: ${{ always() && needs.test.result != 'failure' && needs.test.result != 'cancelled' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Resolve image names
        id: names
        # GHCR rejects an uppercase path, and github.repository preserves the
        # case of the owner as typed on GitHub.
        run: echo "registry=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags every time: the moving one the stack follows, and an immutable
      # one so a rollback has something to point at.
      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          tags: |
            ${{ steps.names.outputs.registry }}/api:${{ inputs.image_tag }}
            ${{ steps.names.outputs.registry }}/api:sha-${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          # Baked into the Nitro bundle — see the route rule in nuxt.config.ts.
          # It is why the compose file's API service must be named `api`.
          build-args: |
            NUXT_API_TARGET=http://api:4000
          tags: |
            ${{ steps.names.outputs.registry }}/web:${{ inputs.image_tag }}
            ${{ steps.names.outputs.registry }}/web:sha-${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Trigger Portainer redeploy
        # The webhook URL is the credential: holding it is enough to redeploy
        # the stack. It is a secret, so GitHub redacts it from this public log —
        # but redaction matches the *whole* value, and curl's own errors quote
        # only a piece of it. `curl: (6) Could not resolve host: <portainer
        # host>` is not the secret verbatim, so it would not be masked, and a
        # failed deploy would publish where Portainer lives. That is why curl's
        # stderr never reaches the log and the diagnosis is an exit code and an
        # HTTP status instead, which say what went wrong without saying where.
        #
        # The stack follows the moving `${{ inputs.image_tag }}` tag and this
        # POST is all it takes: a Git-stack webhook re-pulls before it
        # redeploys. Verified rather than assumed — after a redeploy the
        # previously-running image ids were left *dangling* on the host, which
        # only happens when the tag is moved onto something newly fetched.
        #
        # Portainer's "Re-pull image" switch is Business Edition, and its
        # tooltip claims to govern this. It does not govern the webhook path on
        # CE 2.33; do not add machinery to work around a switch that is not in
        # the way. Passing `?IMAGE_TAG=…` to pin an immutable tag was tried and
        # is silently ignored — variables-by-query belong to the *non-git*
        # stack webhook, which the UI gates behind `"repository" !== method`.
        env:
          WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK_DEV }}
        run: |
          # Portainer answers only once the redeploy is done, and that includes
          # pulling both images — minutes on a cold cache, not seconds.
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
                   --max-time 600 -X POST "$WEBHOOK" 2>/dev/null) || status=$?
          status=${status:-0}
          if [ "$status" -ne 0 ]; then
            echo "::error::Portainer webhook unreachable (curl exit $status). URL withheld — it is a secret, and its host would otherwise be published in this log."
            exit 1
          fi
          case "$code" in
            2*) echo "Portainer redeployed the stack (HTTP $code)." ;;
            404) echo "::error::Portainer has no webhook with that id (HTTP 404). The webhook is created by the stack's GitOps updates switch — a stack with it off has none, and an id from an earlier stack is dead."
                 exit 1 ;;
            *)  echo "::error::Portainer rejected the redeploy (HTTP $code)."
                exit 1 ;;
          esac

      - name: Summary
        # With a manual branch picker, "what is actually on dev right now?"
        # stops being obvious. This is the answer, in the run's own summary.
        #
        # Deliberately no link to the site. This repository is public, and on a
        # public repository the run log *and* the job summary are readable by
        # anyone without signing in — so anything printed here is published.
        # Branch, commit and tag are already public in this repo; the hostname
        # is not, and putting it behind a repository variable would not change
        # that, because it is the printing that publishes it, not the storing.
        run: |
          {
            echo "### Deployed to dev"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Commit | \`${GITHUB_SHA:0:12}\` |"
            echo "| Tags | \`${{ inputs.image_tag }}\`, \`sha-${GITHUB_SHA}\` |"
            echo "| Tests | ${{ needs.test.result == 'skipped' && 'skipped' || needs.test.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
