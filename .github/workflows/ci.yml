# Feedback only. This workflow ships nothing — deploying is a button, in
# deploy-dev.yml.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # A second push to the same branch makes the first run's answer irrelevant.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/tests.yml
