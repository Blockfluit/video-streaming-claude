# Feedback only. This workflow publishes nothing — building images is a button,
# in build-dev.yml, and deploying is a separate one in Portainer.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # A second push to the same branch makes the first run's answer irrelevant.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/tests.yml
